# Theming — static dark palette (black/white/gray, red as the only accent).
# No longer follows the wallpaper-driven Material You colors.
background            #0d0d0d
foreground            #e6e6e6
cursor                #ffffff

color0                #1a1a1a
color1                #e0483e
color2                #808080
color3                #999999
color4                #666666
color5                #8c8c8c
color6                #737373
color7                #cfcfcf
color8                #4d4d4d
color9                #ff5c52
color10               #a6a6a6
color11               #bfbfbf
color12               #8a8a8a
color13               #a3a3a3
color14               #969696
color15               #ffffff

# Transparency (blur comes from Hyprland's compositor-level blur, already enabled globally)
background_opacity 0.85
dynamic_background_opacity yes

# Font
font_family      IosevkaTerm Nerd Font
font_size 13.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding
window_margin_width 8

# No stupid close confirmation
confirm_os_window_close 0

# Use the user's login shell (zsh)
shell .

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
