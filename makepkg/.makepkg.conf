# User overrides for /etc/makepkg.conf (sourced after it).

# Build with all CPU cores.
MAKEFLAGS="-j$(nproc)"

# Same as the system default, minus debug packages.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

# Skip compressing built packages (big prebuilt AUR apps like IDEs).
PKGEXT='.pkg.tar'
