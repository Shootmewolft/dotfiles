# lazygit — Kanagawa Wave colors, matching kitty, Zed and Neovim.
# Inside Neovim (<leader>gg) snacks.nvim layers a theme generated from the
# active colorscheme on top of this file, so both look the same.
gui:
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor:
      - "#FF9E3B" # roninYellow (same as Neovim's MatchParen)
      - bold
    inactiveBorderColor:
      - "#54546D" # sumiInk4
    searchingActiveBorderColor:
      - "#E6C384" # carpYellow
      - bold
    optionsTextColor:
      - "#7E9CD8" # crystalBlue
    selectedLineBgColor:
      - "#223249" # waveBlue1 (kitty selection background)
    inactiveViewSelectedLineBgColor:
      - "#2A2A37" # sumiInk3
    cherryPickedCommitBgColor:
      - "#2D4F67" # waveBlue2
    cherryPickedCommitFgColor:
      - "#7FB4CA" # springBlue
    markedBaseCommitBgColor:
      - "#2D4F67" # waveBlue2
    markedBaseCommitFgColor:
      - "#E6C384" # carpYellow
    unstagedChangesColor:
      - "#FF5D62" # peachRed
    defaultFgColor:
      - "#DCD7BA" # fujiWhite
    authorColors:
      "*": "#957FB8" # oniViolet
