term=xterm-256color

title=foot

font=IosevkaTerm Nerd Font:size=13
letter-spacing=0
dpi-aware=no

pad=8x8

bold-text-in-bright=no

[colors]
alpha=0.85

# Static dark palette (black/white/gray, red as the only accent) — matches kitty
background=0d0d0d
foreground=e6e6e6

regular0=1a1a1a
regular1=e0483e
regular2=808080
regular3=999999
regular4=666666
regular5=8c8c8c
regular6=737373
regular7=cfcfcf

bright0=4d4d4d
bright1=ff5c52
bright2=a6a6a6
bright3=bfbfbf
bright4=8a8a8a
bright5=a3a3a3
bright6=969696
bright7=ffffff

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5
# underline-thickness=<font underline thickness>

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c
