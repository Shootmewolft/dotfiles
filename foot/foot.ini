term=xterm-256color

title=foot

font=IosevkaTerm Nerd Font:size=13
letter-spacing=0
dpi-aware=no

pad=8x8

bold-text-in-bright=no

[colors]
# Opacity matches Zed's Kanagawa Wave Blur background alpha (#101018c0 -> 0xc0/255)
alpha=0.75

# Same colors as Zed's "Kanagawa Wave Blur" theme (pulled straight from the theme's
# own JSON), so the terminal matches the editor exactly.
background=101018
foreground=DCD7BA
selection-background=223249
selection-foreground=DCD7BA

regular0=16161D
regular1=C34043
regular2=76946A
regular3=FF9E3B
regular4=658594
regular5=957FB8
regular6=9CABCA
regular7=DCD7BA

bright0=54546D
bright1=FF5D62
bright2=98BB6C
bright3=E6C384
bright4=7FB4CA
bright5=D27E99
bright6=A3D4D5
bright7=DCD7BA

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5
# underline-thickness=<font underline thickness>

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c
