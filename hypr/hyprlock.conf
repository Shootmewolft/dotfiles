source = ~/.config/hypr/hyprlock/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = true
    no_fade_out = false
}

# Great Wave off Kanagawa (Hokusai, public domain), color-graded and blurred
# to match the Kanagawa Wave Blur theme used across kitty/foot/zed.
background {
    monitor =
    path = $background_image
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.18
    vibrancy_darkness = 0.2
}

# Translucent glass panel behind the clock/input so text stays legible
# regardless of what's underneath in the wave image.
shape {
    monitor =
    size = 480, 340
    color = $panel_color
    rounding = 24
    border_size = 0
    position = 0, 40
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 72
    font_family = $font_family_clock
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/date.sh
    color = $text_muted_color
    font_size = 16
    font_family = $font_family
    position = 0, 80
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =    $USER
    color = $text_muted_color
    font_size = 15
    font_family = $font_family
    position = 0, 10
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    rounding = 16
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fail_color = $fail_color
    check_color = $check_color
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000080)
}

# Caps Lock warning
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $caps_color
    font_size = 13
    font_family = $font_family
    position = 0, -110
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = $LAYOUT
    color = $text_muted_color
    font_size = 13
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

# Status (battery, etc.)
label {
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_muted_color
    font_size = 13
    font_family = $font_family
    position = 30, -30
    halign = left
    valign = top
}
